<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>청담대교 통합 결과 뷰어 - PyBridge v0.9.3</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; background: #0a0e1a; color: #e8eaed; font-family: -apple-system, "Pretendard", sans-serif; overflow: hidden; }
#app { display: grid; grid-template-columns: 280px 1fr 320px; height: 100vh; }

.panel { background: #131826; border-right: 1px solid #1f2937; overflow-y: auto; padding: 16px; }
.panel:last-child { border-right: none; border-left: 1px solid #1f2937; }

h1 { font-size: 14px; color: #60a5fa; margin-bottom: 4px; }
h2 { font-size: 11px; text-transform: uppercase; color: #6b7280; margin: 16px 0 8px; letter-spacing: 0.5px; }
h3 { font-size: 12px; color: #e8eaed; margin: 8px 0 4px; }

.subtitle { font-size: 10px; color: #9ca3af; margin-bottom: 16px; }

.tab-group { display: flex; flex-direction: column; gap: 4px; }
.tab { padding: 8px 12px; background: #1a2030; border-radius: 6px; cursor: pointer; font-size: 12px; transition: all 0.15s; border: 1px solid transparent; }
.tab:hover { background: #1f2937; }
.tab.active { background: #1e3a5f; border-color: #3b82f6; color: #93c5fd; }

.mode-item { padding: 8px 10px; background: #1a2030; border-radius: 4px; margin-bottom: 4px; cursor: pointer; font-size: 11px; transition: all 0.15s; border-left: 3px solid transparent; }
.mode-item:hover { background: #1f2937; }
.mode-item.active { background: #1e3a5f; border-left-color: #3b82f6; }
.mode-item .freq { color: #93c5fd; font-weight: 500; }
.mode-item .mpm { color: #9ca3af; font-size: 10px; }

#viewer { position: relative; background: radial-gradient(ellipse at center, #1a1f2e 0%, #0a0e1a 100%); overflow: hidden; }
#canvas { width: 100%; height: 100%; display: block; cursor: grab; }
#canvas:active { cursor: grabbing; }

#info { position: absolute; top: 12px; left: 12px; padding: 10px 14px; background: rgba(19,24,38,0.92); border: 1px solid #1f2937; border-radius: 6px; font-size: 11px; color: #e8eaed; max-width: 280px; backdrop-filter: blur(8px); }
#info .title { color: #60a5fa; font-weight: 500; font-size: 12px; }
#info .value { color: #93c5fd; }

#controls { position: absolute; bottom: 12px; left: 12px; padding: 10px 14px; background: rgba(19,24,38,0.92); border: 1px solid #1f2937; border-radius: 6px; font-size: 10px; color: #9ca3af; backdrop-filter: blur(8px); }

#legend { position: absolute; top: 12px; right: 12px; padding: 10px 14px; background: rgba(19,24,38,0.92); border: 1px solid #1f2937; border-radius: 6px; font-size: 10px; backdrop-filter: blur(8px); }
.lg-row { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; }
.lg-color { width: 14px; height: 3px; border-radius: 1px; }

#view-presets {
  position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 4px; padding: 6px;
  background: rgba(19,24,38,0.92); border: 1px solid #1f2937;
  border-radius: 6px; backdrop-filter: blur(8px);
}
.vp-btn {
  background: transparent; border: 1px solid transparent;
  color: #9ca3af; padding: 5px 10px; font-size: 10px;
  cursor: pointer; border-radius: 4px; font-family: inherit;
  transition: all 0.15s; letter-spacing: 0.5px;
}
.vp-btn:hover { background: #1f2937; color: #e8eaed; }
.vp-btn.active { background: #1e3a5f; border-color: #3b82f6; color: #93c5fd; }

#axis-indicator {
  position: absolute; bottom: 12px; right: 12px;
  background: rgba(19,24,38,0.92); border: 1px solid #1f2937;
  border-radius: 6px; padding: 4px; backdrop-filter: blur(8px);
}

.slider-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.slider-row label { font-size: 10px; color: #9ca3af; min-width: 50px; }
input[type=range] { flex: 1; height: 4px; background: #1f2937; border-radius: 2px; outline: none; -webkit-appearance: none; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; background: #3b82f6; border-radius: 50%; cursor: pointer; }

.stat-card { background: #1a2030; border-radius: 6px; padding: 10px 12px; margin-bottom: 8px; border-left: 3px solid #3b82f6; }
.stat-card .label { font-size: 10px; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.3px; }
.stat-card .value { font-size: 20px; color: #fff; font-weight: 500; margin-top: 2px; }
.stat-card .sub { font-size: 10px; color: #6b7280; margin-top: 2px; }
.stat-card.green { border-left-color: #10b981; }
.stat-card.amber { border-left-color: #f59e0b; }

.compare-row { display: flex; justify-content: space-between; padding: 4px 0; font-size: 11px; }
.compare-row .lbl { color: #9ca3af; }
.compare-row .val { color: #e8eaed; font-family: ui-monospace, monospace; }
.err-good { color: #10b981; }

#chart { width: 100%; height: 180px; background: #0a0e1a; border-radius: 6px; margin-top: 8px; }
canvas { display: block; }

.toggle { display: flex; align-items: center; gap: 6px; padding: 6px 10px; background: #1a2030; border-radius: 4px; cursor: pointer; font-size: 11px; margin-bottom: 4px; }
.toggle:hover { background: #1f2937; }
.toggle input { accent-color: #3b82f6; }
</style>
</head>
<body>
<div id="app">

<!-- LEFT PANEL: Categories & Modes -->
<div class="panel">
<h1>청담대교</h1>
<div class="subtitle">PyBridge v0.9.3 통합 결과</div>

<h2>해석 유형</h2>
<div class="tab-group" id="analysis-tabs">
<div class="tab active" data-view="model">모델 형상</div>
<div class="tab" data-view="static">정적 자중 해석</div>
<div class="tab" data-view="modes">고유치 해석</div>
</div>

<div id="mode-list" style="display:none;">
<h2>전역모드 (MPM ≥ 0.5%)</h2>
<div style="font-size:10px;color:#6b7280;margin-bottom:8px;">국부모드 제외, 축별 분류</div>
<div id="mode-categories"></div>
</div>

<h2>표시 옵션</h2>
<div class="toggle"><input type="checkbox" id="show-bc" checked><label for="show-bc">경계조건</label></div>
<div class="toggle"><input type="checkbox" id="show-gerber" checked><label for="show-gerber">게르버 조인트 (4개)</label></div>
<div class="toggle"><input type="checkbox" id="show-deformed" checked><label for="show-deformed">변형 형상</label></div>
<div class="toggle"><input type="checkbox" id="show-undeformed"><label for="show-undeformed">원형상 (점선)</label></div>

<div id="scale-control" style="display:none;">
<h2>변형 스케일</h2>
<div class="slider-row">
<label>배율</label>
<input type="range" id="scale" min="1" max="500" value="100">
<span id="scale-val" style="font-size:10px;color:#93c5fd;width:32px;">100</span>
</div>
<div class="slider-row">
<label>애니메이션</label>
<input type="range" id="anim-speed" min="0" max="100" value="50">
<span id="anim-val" style="font-size:10px;color:#93c5fd;width:32px;">50%</span>
</div>
</div>
</div>

<!-- CENTER: 3D Viewer -->
<div id="viewer">
<canvas id="canvas"></canvas>
<div id="info">
<div class="title" id="info-title">모델 형상</div>
<div id="info-content">청담대교 BIM 모델</div>
</div>

<div id="view-presets">
<button class="vp-btn active" data-view="iso" title="대각선 (Isometric)">⌘ ISO</button>
<button class="vp-btn" data-view="persp" title="투시도">◇ PERSP</button>
<button class="vp-btn" data-view="top" title="평면 (위에서)">▢ TOP</button>
<button class="vp-btn" data-view="side" title="측면 (옆에서, X-Z)">▭ SIDE</button>
<button class="vp-btn" data-view="front" title="정면 (교축방향, Y-Z)">▯ FRONT</button>
</div>

<div id="axis-indicator">
<svg width="80" height="80" viewBox="-40 -40 80 80">
<g id="axis-svg"></g>
</svg>
</div>

<div id="controls">
드래그: 회전 | Shift+드래그: 이동 | 휠: 줌 | R: 리셋
</div>
<div id="legend"></div>
</div>

<!-- RIGHT PANEL: Results -->
<div class="panel">
<h2>해석 정보</h2>
<div id="result-cards"></div>

<h2>MIDAS 비교</h2>
<div id="midas-compare"></div>

<h2>변위 그래프</h2>
<canvas id="chart"></canvas>
<div id="chart-info" style="font-size:10px;color:#9ca3af;margin-top:6px;text-align:center;"></div>

<h2 id="mpm-title" style="display:none;">모달참여질량 (MPM)</h2>
<div id="mpm-content"></div>
</div>

</div>

function decompress(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i=0; i<bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const ds = new DecompressionStream("gzip");
  const stream = new Response(new Blob([bytes]).stream().pipeThrough(ds));
  return stream.text().then(JSON.parse);
}

let DATA = null;
let currentView = 'model';
let currentMode = null;
let scaleFactor = 100;
let animPhase = 0;
let animSpeed = 50;

// ===== 3D Viewer =====
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W=0, H=0;

// MCT 좌표계: X=교축(길이), Y=교축직각(폭), Z=연직(높이)
// rotZ: 평면 회전 (Z축 기준), rotX: 상하 틸팅 (X축 기준)
const view = {
  rotZ: 0, rotX: 0,
  panX: 0, panY: 0, zoom: 1,
  cx: 0, cy: 0, cz: 0,
  yScale: 1
};

function resize() {
  const dpr = window.devicePixelRatio || 1;
  W = canvas.clientWidth; H = canvas.clientHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener('resize', () => { resize(); render(); });

function project(p) {
  // Translate to model center
  let x = p[0] - view.cx;
  let y = p[1] - view.cy;
  let z = p[2] - view.cz;
  
  // Rotate around Z (vertical axis, plan rotation)
  let cz = Math.cos(view.rotZ), sz = Math.sin(view.rotZ);
  let x1 = x * cz - y * sz;
  let y1 = x * sz + y * cz;
  let z1 = z;
  
  // Rotate around X' (camera tilt, horizontal axis after Z rotation)
  let cx_ = Math.cos(view.rotX), sx_ = Math.sin(view.rotX);
  let x2 = x1;
  let y2 = y1 * cx_ - z1 * sx_;
  let z2 = y1 * sx_ + z1 * cx_;
  
  // Project: screen X = x2, screen Y = -z2 (Z up on screen), depth = y2
  return {
    x: W/2 + (x2 * view.zoom + view.panX),
    y: H/2 + (-z2 * view.zoom + view.panY),
    z: y2
  };
}

// View presets
const VIEW_PRESETS = {
  'iso': { rotZ: -0.6, rotX: -1.0, label: '대각선' },        // 조감도
  'top': { rotZ: 0, rotX: -Math.PI/2, label: '평면 (Top)' }, // 위에서
  'side': { rotZ: 0, rotX: 0, label: '측면 (Side)' },        // 옆에서 (X-Z)
  'front': { rotZ: -Math.PI/2, rotX: 0, label: '정면 (Front)' }, // 교축방향
  'persp': { rotZ: -0.4, rotX: -0.4, label: '투시도' },
};

function setView(preset) {
  const p = VIEW_PRESETS[preset];
  if (!p) return;
  view.rotZ = p.rotZ;
  view.rotX = p.rotX;
  fitView();
  render();
}

// ★ JET colormap (MATLAB-style rainbow): 진파랑→파랑→시안→녹색→노랑→빨강→진빨강
function jetColor(t) {
  t = Math.max(0, Math.min(1, t));
  let r, g, b;
  if (t < 0.125) {
    r = 0; g = 0; b = 0.5 + t * 4;
  } else if (t < 0.375) {
    r = 0; g = (t - 0.125) * 4; b = 1;
  } else if (t < 0.625) {
    r = (t - 0.375) * 4; g = 1; b = 1 - (t - 0.375) * 4;
  } else if (t < 0.875) {
    r = 1; g = 1 - (t - 0.625) * 4; b = 0;
  } else {
    r = 1 - (t - 0.875) * 4 * 0.5; g = 0; b = 0;
  }
  return `rgb(${Math.round(r*255)},${Math.round(g*255)},${Math.round(b*255)})`;
}

// Cache for node displacement magnitudes (normalized 0~1)
let displacementField = null;
let displacementMinMax = [0, 1];

function computeDisplacementField() {
  displacementField = {};
  let minVal = Infinity, maxVal = -Infinity;
  
  if (currentView === 'static') {
    // Use total displacement magnitude
    for (const nid in DATA.static) {
      const d = DATA.static[nid];
      const mag = Math.sqrt(d.ux*d.ux + d.uy*d.uy + d.uz*d.uz);
      displacementField[nid] = mag;
      if (mag > maxVal) maxVal = mag;
      if (mag < minVal) minVal = mag;
    }
  } else if (currentView === 'modes' && currentMode) {
    // Use total mode shape magnitude (already normalized to max=1)
    for (const nid in currentMode.shape) {
      const d = currentMode.shape[nid];
      const mag = Math.sqrt(d[0]*d[0] + d[1]*d[1] + d[2]*d[2]);
      displacementField[nid] = mag;
      if (mag > maxVal) maxVal = mag;
      if (mag < minVal) minVal = mag;
    }
    // Fill missing nodes with 0
    for (const nid in DATA.nodes) {
      if (!(nid in displacementField)) displacementField[nid] = 0;
    }
  }
  displacementMinMax = [minVal === Infinity ? 0 : minVal, maxVal === -Infinity ? 1 : maxVal];
}

function getNodeColor(nid) {
  if (!displacementField) return '#666';
  const val = displacementField[nid];
  if (val === undefined) return '#374151';
  const [mn, mx] = displacementMinMax;
  const t = mx > mn ? (val - mn) / (mx - mn) : 0;
  return jetColor(t);
}

function getDeformedPos(nid) {
  const orig = DATA.nodes[nid];
  if (!orig) return null;
  
  if (currentView === 'static') {
    const d = DATA.static[nid];
    if (!d) return [...orig];
    return [
      orig[0] + d.ux * scaleFactor,
      orig[1] + d.uy * scaleFactor,
      orig[2] + d.uz * scaleFactor
    ];
  } else if (currentView === 'modes' && currentMode) {
    const d = currentMode.shape[nid];
    if (!d) return [...orig];
    const amp = Math.sin(animPhase) * scaleFactor * 0.05;
    return [
      orig[0] + d[0] * amp,
      orig[1] + d[1] * amp,
      orig[2] + d[2] * amp
    ];
  }
  return [...orig];
}

function render() {
  ctx.fillStyle = '#0a0e1a';
  ctx.fillRect(0, 0, W, H);
  
  if (!DATA) return;
  
  const showUndeformed = document.getElementById('show-undeformed').checked;
  const showDeformed = document.getElementById('show-deformed').checked;
  const showBC = document.getElementById('show-bc').checked;
  const showGerber = document.getElementById('show-gerber').checked;
  
  // Draw undeformed (faint)
  if (showUndeformed && currentView !== 'model') {
    ctx.strokeStyle = 'rgba(100,116,139,0.25)';
    ctx.lineWidth = 0.4;
    for (const e of DATA.elements) {
      const n1 = DATA.nodes[e.n[0]]; const n2 = DATA.nodes[e.n[1]];
      if (!n1 || !n2) continue;
      const p1 = project(n1); const p2 = project(n2);
      ctx.beginPath();
      ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y);
      ctx.stroke();
    }
  }
  
  // Sort elements by depth
  const items = [];
  const useContour = (currentView === 'static' || (currentView === 'modes' && currentMode));
  
  for (const e of DATA.elements) {
    const pos1 = (showDeformed || currentView === 'model') ? getDeformedPos(e.n[0]) : DATA.nodes[e.n[0]];
    const pos2 = (showDeformed || currentView === 'model') ? getDeformedPos(e.n[1]) : DATA.nodes[e.n[1]];
    if (!pos1 || !pos2) continue;
    const p1 = project(pos1); const p2 = project(pos2);
    const grp = DATA.sec_groups[e.s] || 'OTH';
    
    let color1, color2;
    if (useContour) {
      color1 = getNodeColor(e.n[0]);
      color2 = getNodeColor(e.n[1]);
    } else {
      color1 = color2 = SECTION_COLORS[grp] || '#666';
    }
    
    items.push({
      type: 'edge', p1, p2, color1, color2, grp,
      depth: (p1.z + p2.z) / 2,
      width: e.t === 'C' ? 0.5 : (grp === 'RG' || grp === 'HG' ? 1.6 : 0.8)
    });
  }
  
  items.sort((a, b) => a.depth - b.depth);
  
  for (const it of items) {
    if (it.color1 !== it.color2) {
      // Gradient stroke for contour
      const grad = ctx.createLinearGradient(it.p1.x, it.p1.y, it.p2.x, it.p2.y);
      grad.addColorStop(0, it.color1);
      grad.addColorStop(1, it.color2);
      ctx.strokeStyle = grad;
    } else {
      ctx.strokeStyle = it.color1;
    }
    ctx.lineWidth = it.width;
    ctx.beginPath();
    ctx.moveTo(it.p1.x, it.p1.y);
    ctx.lineTo(it.p2.x, it.p2.y);
    ctx.stroke();
  }
  
  // Draw BC markers
  if (showBC) {
    for (const nid in DATA.bc) {
      const orig = DATA.nodes[nid];
      if (!orig) continue;
      const p = project(orig);
      const type = DATA.bc[nid];
      ctx.fillStyle = type === 'pin' ? '#22d3ee' : '#fbbf24';
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 0.5;
      ctx.beginPath();
      if (type === 'pin') {
        ctx.moveTo(p.x, p.y - 5);
        ctx.lineTo(p.x - 5, p.y + 4);
        ctx.lineTo(p.x + 5, p.y + 4);
        ctx.closePath();
      } else {
        ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
      }
      ctx.fill();
      ctx.stroke();
    }
  }
  
  // ★ Draw Gerber joints (internal hinges)
  if (showGerber && DATA.gerber_joints) {
    for (const gj of DATA.gerber_joints) {
      // Use first node of the element pair (hinge location)
      const nid = gj.nodes[1];  // release at J-end typically
      const pos = (showDeformed || currentView === 'model') ? getDeformedPos(nid) : DATA.nodes[nid];
      if (!pos) continue;
      const p = project(pos);
      
      // Draw a hollow circle with cross (pin/hinge symbol)
      ctx.strokeStyle = '#f97316';
      ctx.fillStyle = 'rgba(249,115,22,0.2)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(p.x - 4, p.y - 4); ctx.lineTo(p.x + 4, p.y + 4);
      ctx.moveTo(p.x + 4, p.y - 4); ctx.lineTo(p.x - 4, p.y + 4);
      ctx.stroke();
    }
  }
}

function fitView() {
  if (!DATA) return;
  let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9,minZ=1e9,maxZ=-1e9;
  for (const nid in DATA.nodes) {
    const n = DATA.nodes[nid];
    minX = Math.min(minX, n[0]); maxX = Math.max(maxX, n[0]);
    minY = Math.min(minY, n[1]); maxY = Math.max(maxY, n[1]);
    minZ = Math.min(minZ, n[2]); maxZ = Math.max(maxZ, n[2]);
  }
  view.cx = (minX+maxX)/2; view.cy = (minY+maxY)/2; view.cz = (minZ+maxZ)/2;
  
  // Project all 8 corners of bounding box to find screen bounds
  view.zoom = 1; view.panX = 0; view.panY = 0;
  let sxMin = 1e9, sxMax = -1e9, syMin = 1e9, syMax = -1e9;
  for (const x of [minX, maxX]) {
    for (const y of [minY, maxY]) {
      for (const z of [minZ, maxZ]) {
        const p = project([x, y, z]);
        sxMin = Math.min(sxMin, p.x - W/2);
        sxMax = Math.max(sxMax, p.x - W/2);
        syMin = Math.min(syMin, p.y - H/2);
        syMax = Math.max(syMax, p.y - H/2);
      }
    }
  }
  const xSpan = Math.max(sxMax - sxMin, 1);
  const ySpan = Math.max(syMax - syMin, 1);
  view.zoom = Math.min((W - 80) / xSpan, (H - 80) / ySpan) * 0.95;
}

// ===== Mouse interaction =====
let dragging = false; let lastX, lastY; let shiftDrag = false;
canvas.addEventListener('mousedown', (e) => {
  dragging = true; lastX = e.clientX; lastY = e.clientY; shiftDrag = e.shiftKey;
});
window.addEventListener('mouseup', () => { dragging = false; });
window.addEventListener('mousemove', (e) => {
  if (!dragging) return;
  const dx = e.clientX - lastX; const dy = e.clientY - lastY;
  if (shiftDrag) { view.panX += dx; view.panY += dy; }
  else { 
    view.rotZ += dx * 0.01; view.rotX += dy * 0.01;
    drawAxisIndicator();
  }
  lastX = e.clientX; lastY = e.clientY;
  render();
});
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  view.zoom *= e.deltaY > 0 ? 0.9 : 1.1;
  render();
});
window.addEventListener('keydown', (e) => {
  if (e.key === 'r' || e.key === 'R') { setView('iso'); drawAxisIndicator(); }
  else if (e.key === '1') { setView('iso'); drawAxisIndicator(); }
  else if (e.key === '2') { setView('top'); drawAxisIndicator(); }
  else if (e.key === '3') { setView('side'); drawAxisIndicator(); }
  else if (e.key === '4') { setView('front'); drawAxisIndicator(); }
});

function buildModeList() {
  const container = document.getElementById('mode-categories');
  const colors = {'Y횡방향':'#3b82f6','X교축':'#ef4444','Z수직':'#10b981','비틀림':'#a855f7'};
  let html = '';
  for (const cat in DATA.modes) {
    const modes = DATA.modes[cat];
    if (modes.length === 0) continue;
    html += `<h3 style="color:${colors[cat]};margin-top:12px;">${cat}</h3>`;
    modes.forEach((m, i) => {
      html += `<div class="mode-item" data-cat="${cat}" data-idx="${i}">
        <div class="freq">${(i+1)}차: ${m.freq.toFixed(4)} Hz</div>
        <div class="mpm">T=${m.T.toFixed(3)}s | MPM ${m.mpm_main}%</div>
      </div>`;
    });

  container.innerHTML = html;
  
  container.querySelectorAll('.mode-item').forEach(el => {

      container.querySelectorAll('.mode-item').forEach(x => x.classList.remove('active'));

      updateResultPanel();
      render();
    });
  });
}

function drawChart() {
  const c = document.getElementById('chart');
  const cx = c.getContext('2d');
  c.width = c.clientWidth * 2; c.height = 360;
  cx.scale(2, 2);
  const w = c.clientWidth; const h = 180;
  
  cx.fillStyle = '#0a0e1a';
  cx.fillRect(0, 0, w, h);
  
  if (currentView === 'model') {
    cx.fillStyle = '#6b7280';
    cx.font = '10px sans-serif';
    cx.textAlign = 'center';
    cx.fillText('해석 유형을 선택하세요', w/2, h/2);
    document.getElementById('chart-info').textContent = '';
    return;
  }
  
  // Collect girder centerline (Y≈4 subway, Y≈8 road)
  const points = [];
  for (const nid in DATA.nodes) {
    const n = DATA.nodes[nid];
    if (Math.abs(n[1] - 8) < 1 && Math.abs(n[2] - (-10.05)) < 0.5) {
      let val = 0;
      if (currentView === 'static') {
        const d = DATA.static[nid];
        val = d ? d.uz * 1000 : 0;
      } else if (currentView === 'modes' && currentMode) {
        const d = currentMode.shape[nid];
        if (d) {
          if (currentMode.cat === 'Y횡방향') val = d[1];
          else if (currentMode.cat === 'X교축') val = d[0];
          else if (currentMode.cat === 'Z수직') val = d[2];
          else val = Math.sqrt(d[0]*d[0]+d[1]*d[1]+d[2]*d[2]);
        }
      }
      points.push({x: n[0], y: val});
    }
  }
  points.sort((a,b) => a.x - b.x);
  
  if (points.length === 0) return;
  
  const xMin = 0, xMax = 660;
  let yMin = Infinity, yMax = -Infinity;
  for (const p of points) {
    yMin = Math.min(yMin, p.y); yMax = Math.max(yMax, p.y);
  }
  if (yMin === yMax) { yMin -= 1; yMax += 1; }
  const yPad = (yMax - yMin) * 0.1;
  yMin -= yPad; yMax += yPad;
  
  const px = (x) => 30 + (x - xMin) / (xMax - xMin) * (w - 40);
  const py = (y) => 20 + (1 - (y - yMin) / (yMax - yMin)) * (h - 40);
  
  // Axes
  cx.strokeStyle = '#1f2937';
  cx.lineWidth = 0.5;
  cx.beginPath();
  cx.moveTo(30, 20); cx.lineTo(30, h - 20);
  cx.lineTo(w - 10, h - 20);
  cx.stroke();
  
  // Zero line
  if (yMin < 0 && yMax > 0) {
    cx.strokeStyle = '#374151';
    cx.setLineDash([2, 2]);
    cx.beginPath();
    cx.moveTo(30, py(0)); cx.lineTo(w - 10, py(0));
    cx.stroke();
    cx.setLineDash([]);
  }
  
  // Span markers (EJ)
  cx.strokeStyle = '#fbbf24';
  cx.lineWidth = 0.5;
  cx.setLineDash([3, 3]);
  for (const ejX of [240, 420]) {
    cx.beginPath();
    cx.moveTo(px(ejX), 20); cx.lineTo(px(ejX), h - 20);
    cx.stroke();
  }
  cx.setLineDash([]);
  
  // Curve
  cx.strokeStyle = currentView === 'static' ? '#60a5fa' : '#a855f7';
  cx.lineWidth = 1.5;
  cx.beginPath();
  for (let i = 0; i < points.length; i++) {
    const p = points[i];
    if (i === 0) cx.moveTo(px(p.x), py(p.y));
    else cx.lineTo(px(p.x), py(p.y));
  }
  cx.stroke();
  
  // Fill area
  cx.fillStyle = currentView === 'static' ? 'rgba(96,165,250,0.15)' : 'rgba(168,85,247,0.15)';
  cx.beginPath();
  cx.moveTo(px(points[0].x), py(0));
  for (const p of points) cx.lineTo(px(p.x), py(p.y));
  cx.lineTo(px(points[points.length-1].x), py(0));
  cx.closePath();
  cx.fill();
  
  // Labels
  cx.fillStyle = '#9ca3af';
  cx.font = '9px sans-serif';
  cx.textAlign = 'right';
  cx.fillText(yMax.toFixed(1), 28, 24);
  cx.fillText(yMin.toFixed(1), 28, h - 18);
  cx.textAlign = 'center';
  cx.fillText('0m', 30, h - 5);
  cx.fillText('660m', w - 10, h - 5);
  
  let unit = '';
  if (currentView === 'static') unit = '도로교 (Y=8) 처짐 [mm]';
  else unit = `도로교 모드형상 (정규화)`;
  document.getElementById('chart-info').textContent = unit;
}

      <div class="compare-row"><span class="lbl">Z수직</span><span class="val">${currentMode.mpm['Z수직']}%</span></div>
      <div class="compare-row"><span class="lbl">RX 비틀림</span><span class="val">${currentMode.mpm['RX비틀림']}%</span></div>`;
  }
  
  drawChart();
}

function drawAxisIndicator() {
  // Draw small axis triad showing current orientation
  const svg = document.getElementById('axis-svg');
  const axes = [
    { vec: [1, 0, 0], color: '#ef4444', label: 'X' },  // X red
    { vec: [0, 1, 0], color: '#10b981', label: 'Y' },  // Y green
    { vec: [0, 0, 1], color: '#3b82f6', label: 'Z' },  // Z blue
  ];
  
  // Project unit vectors using current rotation (without translation/zoom)
  const projAxis = (v) => {
    const cz = Math.cos(view.rotZ), sz = Math.sin(view.rotZ);
    const x1 = v[0] * cz - v[1] * sz;
    const y1 = v[0] * sz + v[1] * cz;
    const z1 = v[2];
    const cx = Math.cos(view.rotX), sx = Math.sin(view.rotX);
    const x2 = x1;
    const y2 = y1 * cx - z1 * sx;
    const z2 = y1 * sx + z1 * cx;
    return { x: x2 * 25, y: -z2 * 25, depth: y2 };
  };
  
  let html = '';
  const projected = axes.map(a => ({...a, p: projAxis(a.vec)}));
  // Sort by depth so back axes drawn first
  projected.sort((a, b) => a.p.depth - b.p.depth);
  
  for (const a of projected) {
    html += `<line x1="0" y1="0" x2="${a.p.x}" y2="${a.p.y}" stroke="${a.color}" stroke-width="2"/>`;
    html += `<text x="${a.p.x * 1.25}" y="${a.p.y * 1.25 + 3}" fill="${a.color}" font-size="11" text-anchor="middle" font-family="sans-serif" font-weight="600">${a.label}</text>`;
  }
  svg.innerHTML = html;
}
document.querySelectorAll('#analysis-tabs .tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('#analysis-tabs .tab').forEach(x => x.classList.remove('active'));
    tab.classList.add('active');
    currentView = tab.dataset.view;
    document.getElementById('mode-list').style.display = currentView === 'modes' ? 'block' : 'none';
    document.getElementById('scale-control').style.display = currentView !== 'model' ? 'block' : 'none';
    if (currentView !== 'modes') currentMode = null;
    if (currentView === 'static') scaleFactor = 200;
    else if (currentView === 'modes') scaleFactor = 100;
    document.getElementById('scale').value = scaleFactor;
    document.getElementById('scale-val').textContent = scaleFactor;
    computeDisplacementField();
    updateInfo();
    updateLegend();
    updateResultPanel();
    render();
  });
});

document.getElementById('scale').addEventListener('input', (e) => {
  scaleFactor = parseInt(e.target.value);
  document.getElementById('scale-val').textContent = scaleFactor;
  render();
});

document.getElementById('anim-speed').addEventListener('input', (e) => {
  animSpeed = parseInt(e.target.value);
  document.getElementById('anim-val').textContent = animSpeed + '%';
});

['show-bc', 'show-gerber', 'show-deformed', 'show-undeformed'].forEach(id => {
  document.getElementById(id).addEventListener('change', render);
});

// ===== Animation loop =====
function animate() {
  if (currentView === 'modes' && currentMode && animSpeed > 0) {
    animPhase += animSpeed * 0.001;
    render();
  }
  requestAnimationFrame(animate);
}

  drawAxisIndicator();

});
